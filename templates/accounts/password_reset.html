{% extends 'base.html' %}
{% block title %}Reset Password - HouseFinder Mombasa{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <i class="fas fa-key fa-3x text-warning mb-4"></i>
                <h2 class="fw-bold mb-3">Forgot Password?</h2>
                <p class="text-muted mb-4">Enter your email and we'll send you a link to reset your password.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        {{ form.email.label_tag }}
                        {{ form.email }}
                    </div>
                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">Send Reset Link</button>
                </form>
                
                <div class="mt-4">
                    <a href="{% url 'accounts:login' %}" class="text-primary">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
